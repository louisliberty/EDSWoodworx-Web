# Builds the site and uploads it to HostGator by FTP on every push to main.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.edswoodworx.com or the server name from HostGator
#   FTP_USERNAME  the FTP account's full username
#   FTP_PASSWORD  the FTP account's password
# Optional repository variable FTP_DIR: folder for the site on the server
#   (default ./ = the FTP account's own folder, which should be the site's folder)
# Until FTP_SERVER is set, the workflow builds the site and skips the upload.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node build.mjs

      - name: Check for FTP settings
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "FTP_SERVER secret not set yet; skipping upload."; fi

      - name: Upload to HostGator
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.well-known/**
